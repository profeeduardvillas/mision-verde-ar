<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Misión Verde WebAR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>
<style>
html,body{margin:0;overflow:hidden;background:#000;font-family:Arial,sans-serif}video{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;z-index:0!important}a-scene{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;z-index:1!important}a-canvas{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;z-index:1!important}
#hud{position:fixed;z-index:20;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.badge{background:rgba(10,75,38,.92);color:#fff;padding:9px 12px;border-radius:14px;font-weight:700;font-size:14px}
#help{position:fixed;z-index:20;left:12px;right:12px;bottom:14px;background:rgba(255,255,255,.94);color:#17351e;border-radius:16px;padding:12px 14px;text-align:center;font-size:14px}
</style>
</head>
<body>
<div id="hud"><div class="badge">🌎 MISIÓN VERDE</div><div class="badge" id="status">Busca el marcador</div></div>
<div id="help">Apunta la cámara al marcador impreso y manténlo completo dentro de la pantalla.</div>
<a-scene embedded vr-mode-ui="enabled:false" renderer="antialias:true; alpha:true; precision:medium" arjs="sourceType: webcam; videoTexture: true; trackingMethod: best; debugUIEnabled:false; patternRatio:0.50; sourceWidth: window.innerWidth > window.innerHeight ? 640 : 480; sourceHeight: window.innerWidth > window.innerHeight ? 480 : 640; displayWidth: window.innerWidth > window.innerHeight ? 640 : 480; displayHeight: window.innerWidth > window.innerHeight ? 480 : 640; maxDetectionRate:60;">
<a-marker id="mision-verde-marker" type="pattern" url="marker.patt" emitevents="true" smooth="true" smooth-count="5" smooth-tolerance="0.01" smooth-threshold="2">
<a-entity position="0 0.01 0" rotation="-90 0 0">
<a-plane width="2.8" height="2.8" color="#eef8ef" opacity="0.94"></a-plane>
<a-box position="0 0 0.01" width="2.55" height="0.025" depth="0.025" color="#163b22"></a-box>
<a-box position="0 0 0.01" width="0.025" height="0.025" depth="2.55" color="#163b22"></a-box>
</a-entity>
<a-entity position="0.85 0.15 -0.34">
<a-cylinder radius="0.08" height="0.5" color="#70472a"></a-cylinder>
<a-sphere radius="0.27" position="0 0.36 0" color="#2d8a3e"></a-sphere>
<a-sphere radius="0.20" position="-0.18 0.30 0" color="#43a047"></a-sphere>
<a-sphere radius="0.20" position="0.18 0.30 0" color="#58b957"></a-sphere>
<a-text value="Árbol (5,2)" align="center" color="#123c20" width="2.2" position="0 0.72 0"></a-text>
</a-entity>
<a-entity position="-0.75 0.06 0.42">
<a-box width="0.75" height="0.035" depth="0.22" color="#27a9e0" rotation="0 0 15"></a-box>
<a-box width="0.55" height="0.035" depth="0.16" color="#61c7ed" position="0.22 0.02 0.06" rotation="0 0 -12"></a-box>
<a-text value="Río (-3,1)" align="center" color="#123c20" width="2.2" position="0 0.25 0"></a-text>
</a-entity>
<a-entity position="0.55 0.05 0.62">
<a-box width="0.42" height="0.55" depth="0.36" color="#159447"></a-box>
<a-box width="0.46" height="0.07" depth="0.40" color="#0d6931" position="0 0.30 0"></a-box>
<a-text value="♻ Reciclaje (2,-2)" align="center" color="#123c20" width="2.2" position="0 0.62 0"></a-text>
</a-entity>
<a-entity position="-0.78 0.10 -0.60">
<a-box width="0.58" height="0.04" depth="0.40" color="#1769aa" rotation="-18 0 0"></a-box>
<a-box width="0.06" height="0.42" depth="0.06" color="#555" position="0 -0.20 0.02"></a-box>
<a-sphere radius="0.12" position="0 0.42 0" color="#ffd43b"></a-sphere>
<a-text value="Panel solar (-4,-3)" align="center" color="#123c20" width="2.2" position="0 0.62 0"></a-text>
</a-entity>
<a-text value="MISIÓN VERDE" align="center" color="#16833d" width="4.0" position="0 1.25 0"></a-text>
<a-text value="Plano cartesiano + ambiente" align="center" color="#17351e" width="2.8" position="0 1.00 0"></a-text>
</a-marker>
<a-entity camera></a-entity>
</a-scene>
<script>
const marker=document.querySelector('#mision-verde-marker');
const status=document.querySelector('#status');
const scene=document.querySelector('a-scene');
window.addEventListener('load',()=>{status.textContent='Iniciando cámara…';});
scene.addEventListener('camera-init',()=>{status.textContent='✓ Cámara lista · busca el marcador';});
scene.addEventListener('camera-error',()=>{status.textContent='⚠️ No se pudo abrir la cámara';});
marker.addEventListener('markerFound',()=>{status.textContent='✓ ¡Marcador reconocido!';});
marker.addEventListener('markerLost',()=>{status.textContent='Busca el marcador';});
</script>
</body>
</html>
