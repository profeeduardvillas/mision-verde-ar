<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Misión Verde · Realidad Aumentada</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>
<style>
html,body{margin:0;overflow:hidden;background:#000;font-family:Arial,sans-serif}
video{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;z-index:0!important}
a-scene{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;z-index:1!important}
a-canvas{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;z-index:1!important}
#hud{position:fixed;z-index:20;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.badge{background:rgba(10,75,38,.92);color:#fff;padding:10px 13px;border-radius:16px;font-weight:700;font-size:14px;box-shadow:0 2px 10px #0003}
#help{position:fixed;z-index:20;left:12px;right:12px;bottom:14px;background:rgba(255,255,255,.92);color:#17351e;border-radius:16px;padding:11px 14px;text-align:center;font-size:14px;line-height:1.35;box-shadow:0 2px 12px #0003}
</style>
</head>
<body>
<div id="hud"><div class="badge">🌎 MISIÓN VERDE</div><div class="badge" id="status">Enfoca el marcador KANJI</div></div>
<div id="help">Apunta la cámara al marcador KANJI impreso y mantén el celular a 20–40 cm 🌱</div>
<a-scene embedded vr-mode-ui="enabled:false" renderer="antialias:true; alpha:true; precision:medium" arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled:false; patternRatio:0.50; maxDetectionRate:30;">
<a-marker id="mision-verde-marker" preset="kanji" emitevents="true" smooth="true" smooth-count="5" smooth-tolerance="0.01" smooth-threshold="2">
<a-entity scale="0.65 0.65 0.65">
<a-entity position="0 0.01 0" rotation="-90 0 0">
<a-plane width="2.8" height="2.8" color="#eef8ef" opacity="0.94"></a-plane>
<a-box position="0 0 0.01" width="2.55" height="0.025" depth="0.025" color="#163b22"></a-box>
<a-box position="0 0 0.01" width="0.025" height="0.025" depth="2.55" color="#163b22"></a-box>
</a-entity>
<a-entity position="0.85 0.15 -0.34">
<a-image src="./assets/arbol.svg" width="0.68" height="0.68" position="0 0.28 0" transparent="true"></a-image>
<a-text value="ÁRBOL&#10;(5, 2)" align="center" color="#123c20" width="2.1" scale="0.52 0.52 0.52" position="0 0.83 0" wrap-count="16"></a-text>
</a-entity>
<a-entity position="-0.75 0.06 0.42">
<a-image src="./assets/rio.svg" width="0.72" height="0.72" position="0 0.24 0" transparent="true"></a-image>
<a-text value="RÍO&#10;(-3, 1)" align="center" color="#123c20" width="2.0" scale="0.52 0.52 0.52" position="0 0.78 0" wrap-count="16"></a-text>
</a-entity>
<a-entity position="0.55 0.05 0.62">
<a-image src="./assets/reciclaje.svg" width="0.65" height="0.65" position="0 0.28 0" transparent="true"></a-image>
<a-text value="RECICLAJE&#10;(2, -2)" align="center" color="#123c20" width="2.2" scale="0.48 0.48 0.48" position="0 0.80 0" wrap-count="16"></a-text>
</a-entity>
<a-entity position="-0.78 0.10 -0.60">
<a-image src="./assets/panel-solar.svg" width="0.72" height="0.72" position="0 0.25 0" transparent="true"></a-image>
<a-text value="PANEL SOLAR&#10;(-4, -3)" align="center" color="#123c20" width="2.2" scale="0.46 0.46 0.46" position="0 0.82 0" wrap-count="18"></a-text>
</a-entity>
<a-text value="MISIÓN VERDE 🌎" align="center" color="#16833d" width="3.0" scale="0.55 0.55 0.55" position="0 1.28 0"></a-text>

</a-entity>
</a-marker>
<a-entity camera></a-entity>
</a-scene>
<script>
const marker=document.querySelector('#mision-verde-marker');
const scene=document.querySelector('a-scene');
const status=document.querySelector('#status');
status.textContent='Iniciando cámara…';
window.addEventListener('camera-init',()=>{status.textContent='Cámara activa · enfoca KANJI';});
scene.addEventListener('camera-init',()=>{status.textContent='Cámara activa · enfoca KANJI';});
window.addEventListener('camera-error',()=>{status.textContent='Cámara bloqueada: permite el acceso en Chrome';});
scene.addEventListener('camera-error',()=>{status.textContent='Cámara bloqueada: permite el acceso en Chrome';});
marker.addEventListener('markerFound',()=>{status.textContent='¡Misión activada! 🌿';});
marker.addEventListener('markerLost',()=>{status.textContent='Cámara activa · enfoca KANJI';});
</script>
</body>
</html>
