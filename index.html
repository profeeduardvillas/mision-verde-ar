<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Misión Verde · Realidad Aumentada</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>
<style>
html,body{margin:0;overflow:hidden;background:#000;font-family:Arial,sans-serif}
video{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;z-index:0!important}
a-scene{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;z-index:1!important}
a-canvas{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;z-index:1!important}
#hud{position:fixed;z-index:20;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.badge{background:rgba(10,75,38,.92);color:#fff;padding:10px 13px;border-radius:16px;font-weight:700;font-size:14px;box-shadow:0 2px 10px #0003}
#help{position:fixed;z-index:20;left:12px;right:12px;bottom:14px;background:rgba(255,255,255,.92);color:#17351e;border-radius:16px;padding:11px 14px;text-align:center;font-size:14px;line-height:1.35;box-shadow:0 2px 12px #0003}
</style>
</head>
<body>
<div id="hud"><div class="badge">🌎 MISIÓN VERDE</div><div class="badge" id="status">Enfoca el marcador KANJI</div></div>
<div id="help">Apunta la cámara al marcador KANJI impreso y mantén el celular a 20–40 cm 🌱</div>
<a-scene embedded vr-mode-ui="enabled:false" renderer="antialias:true; alpha:true; precision:medium" arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled:false; patternRatio:0.50; maxDetectionRate:30;">
<a-marker id="mision-verde-marker" preset="kanji" emitevents="true" smooth="true" smooth-count="5" smooth-tolerance="0.01" smooth-threshold="2">
<a-entity scale="0.65 0.65 0.65">
<a-entity position="0 0.01 0" rotation="-90 0 0">
<!-- Plano blanco eliminado: el fondo de la escena AR queda transparente. -->
<a-box position="0 0 0.01" width="2.55" height="0.025" depth="0.025" color="#163b22"></a-box>
<a-box position="0 0 0.01" width="0.025" height="0.025" depth="2.55" color="#163b22"></a-box>
<!-- Flechas y etiquetas visibles de los ejes cartesianos -->
<a-cone position="1.28 0 0.01" rotation="0 0 -90" radius-bottom="0.075" radius-top="0" height="0.16" color="#163b22"></a-cone>
<a-cone position="0 1.28 0.01" rotation="0 0 0" radius-bottom="0.075" radius-top="0" height="0.16" color="#163b22"></a-cone>
<a-text value="X" align="center" color="#b91c1c" width="1.2" scale="0.48 0.48 0.48" position="1.12 0.18 0.05" font="exo2bold"></a-text>
<a-text value="Y" align="center" color="#1d4ed8" width="1.2" scale="0.48 0.48 0.48" position="0.18 1.12 0.05" font="exo2bold"></a-text>
<a-text value="0" align="center" color="#163b22" width="0.8" scale="0.28 0.28 0.28" position="0.10 -0.13 0.05"></a-text>
</a-entity>
<a-entity id="mission-tree" position="1.10 0.15 -0.44">
<a-cylinder position="0 0.20 0" radius="0.075" height="0.40" color="#8b552e"></a-cylinder>
<a-sphere position="0 0.52 0" radius="0.25" color="#27a844"></a-sphere>
<a-sphere position="-0.16 0.46 0.02" radius="0.17" color="#49c85b"></a-sphere>
<a-sphere position="0.16 0.46 0.02" radius="0.17" color="#16a34a"></a-sphere>
<a-sphere position="-0.07 0.52 0.20" radius="0.025" color="#17351e"></a-sphere>
<a-sphere position="0.07 0.52 0.20" radius="0.025" color="#17351e"></a-sphere>
<a-box position="0 1.13 0.04" width="1.05" height="0.43" depth="0.035" color="#ffe45c" opacity="1"></a-box>
<a-text value="ARBOL" font="exo2bold" align="center" color="#073b2a" width="3.0" scale="0.31 0.31 0.31" position="0 1.23 0.08" wrap-count="28"></a-text>
<a-text value="(5, 2)" font="exo2bold" align="center" color="#073b2a" width="3.0" scale="0.43 0.43 0.43" position="0 1.04 0.08" wrap-count="28"></a-text>
</a-entity>
<a-entity id="mission-river" position="-0.66 0.06 -0.22">
<a-box position="0 0.12 0" width="0.56" height="0.13" depth="0.22" color="#149de0" rotation="0 0 -18"></a-box>
<a-box position="-0.12 0.19 0.01" width="0.48" height="0.10" depth="0.20" color="#53d5ff" rotation="0 0 18"></a-box>
<a-box position="0.12 0.25 0.02" width="0.42" height="0.09" depth="0.18" color="#087fe0" rotation="0 0 -15"></a-box>
<a-sphere position="-0.16 0.30 0.13" radius="0.035" color="#e8fbff"></a-sphere>
<a-sphere position="0.10 0.33 0.13" radius="0.025" color="#e8fbff"></a-sphere>
<a-box position="0 0.89 0.05" width="0.88" height="0.43" depth="0.035" color="#69e5ff" opacity="1"></a-box>
<a-text value="RIO" font="exo2bold" align="center" color="#07345b" width="3.0" scale="0.31 0.31 0.31" position="0 0.99 0.09" wrap-count="28"></a-text>
<a-text value="(-3, 1)" font="exo2bold" align="center" color="#07345b" width="3.0" scale="0.41 0.41 0.41" position="0 0.79 0.09" wrap-count="28"></a-text>
</a-entity>
<a-entity id="mission-recycling" position="0.44 0.05 0.44">
<a-box position="0 0.27 0" width="0.34" height="0.48" depth="0.28" color="#16a34a"></a-box>
<a-box position="0 0.53 0" width="0.39" height="0.07" depth="0.32" color="#65e69a"></a-box>
<a-box position="0 0.59 0" width="0.13" height="0.035" depth="0.10" color="#087a42"></a-box>
<a-text value="♻" align="center" color="#ffffff" width="1.0" scale="0.45 0.45 0.45" position="0 0.25 0.15"></a-text>
<a-sphere position="-0.07 0.36 0.15" radius="0.022" color="#073b28"></a-sphere>
<a-sphere position="0.07 0.36 0.15" radius="0.022" color="#073b28"></a-sphere>
<a-box position="0 1.02 0.05" width="1.08" height="0.44" depth="0.035" color="#8bf0b4" opacity="1"></a-box>
<a-text value="RECICLAJE" font="exo2bold" align="center" color="#06452a" width="3.0" scale="0.29 0.29 0.29" position="0 1.13 0.09" wrap-count="28"></a-text>
<a-text value="(2, -2)" font="exo2bold" align="center" color="#06452a" width="3.0" scale="0.41 0.41 0.41" position="0 0.92 0.09" wrap-count="28"></a-text>
</a-entity>
<a-entity id="mission-solar" position="-0.88 0.10 0.66">
<a-sphere position="0.20 0.60 -0.02" radius="0.14" color="#ffca28"></a-sphere>
<a-sphere position="0.16 0.62 0.10" radius="0.018" color="#71431d"></a-sphere>
<a-sphere position="0.24 0.62 0.10" radius="0.018" color="#71431d"></a-sphere>
<a-box position="0 0.29 0" width="0.52" height="0.06" depth="0.38" color="#1351c5" rotation="0 0 -12"></a-box>
<a-box position="0 0.325 0.01" width="0.48" height="0.012" depth="0.34" color="#39b7ff" rotation="0 0 -12"></a-box>
<a-box position="0 0.22 0" width="0.045" height="0.28" depth="0.045" color="#687a91"></a-box>
<a-box position="0 0.11 0" width="0.26" height="0.035" depth="0.07" color="#687a91"></a-box>
<a-box position="-0.12 0.33 0.03" width="0.012" height="0.015" depth="0.34" color="#b9ecff" rotation="0 0 -12"></a-box>
<a-box position="0 0.33 0.03" width="0.012" height="0.015" depth="0.34" color="#b9ecff" rotation="0 0 -12"></a-box>
<a-box position="0.12 0.33 0.03" width="0.012" height="0.015" depth="0.34" color="#b9ecff" rotation="0 0 -12"></a-box>
<a-box position="0 1.04 0.05" width="1.10" height="0.44" depth="0.035" color="#ffcf70" opacity="1"></a-box>
<a-text value="PANEL SOLAR" font="exo2bold" align="center" color="#553100" width="3.0" scale="0.28 0.28 0.28" position="0 1.15 0.09" wrap-count="28"></a-text>
<a-text value="(-4, -3)" font="exo2bold" align="center" color="#553100" width="3.0" scale="0.40 0.40 0.40" position="0 0.94 0.09" wrap-count="28"></a-text>
</a-entity>
<a-text value="MISIÓN VERDE" align="center" color="#16833d" width="2.6" scale="0.38 0.38 0.38" position="0 1.12 0"></a-text>

</a-entity>
</a-marker>
<a-entity camera></a-entity>
</a-scene>
<script>
const marker=document.querySelector('#mision-verde-marker');
const scene=document.querySelector('a-scene');
const status=document.querySelector('#status');
// 16 misiones ambientales: las primeras cuatro conservan sus modelos originales.
const missions=[
  {id:'mission-tree',name:'ÁRBOL',x:5,y:2,tip:'Reto: ¿por qué son importantes los árboles?'},
  {id:'mission-river',name:'RÍO',x:-3,y:1,tip:'Reto: menciona una forma de proteger los ríos.'},
  {id:'mission-recycling',name:'RECICLAJE',x:2,y:-2,tip:'Reto: ¿qué material puedes separar para reciclar?'},
  {id:'mission-solar',name:'PANEL SOLAR',x:-4,y:-3,tip:'Reto: ¿qué energía aprovecha el panel solar?'},
  {id:'mission-bees',name:'ABEJAS',x:4,y:4,tip:'Reto: ¿cómo ayudan las abejas a las plantas?',emoji:'🐝',color:'#fbbf24',kind:'bee'},
  {id:'mission-garden',name:'HUERTA ESCOLAR',x:-1,y:4,tip:'Reto: menciona algo que puedas cultivar.',emoji:'🌱',color:'#22c55e',kind:'plant'},
  {id:'mission-wind',name:'VIENTO LIMPIO',x:0,y:3,tip:'Reto: ¿cómo puede el viento producir energía?',emoji:'🌬️',color:'#38bdf8',kind:'wind'},
  {id:'mission-wildlife',name:'FAUNA SILVESTRE',x:-5,y:0,tip:'Reto: ¿cómo protegemos los hábitats?',emoji:'🐢',color:'#16a34a',kind:'animal'},
  {id:'mission-flowers',name:'FLORES NATIVAS',x:3,y:5,tip:'Reto: ¿por qué sembrar especies nativas?',emoji:'🌼',color:'#f472b6',kind:'flower'},
  {id:'mission-bike',name:'MOVILIDAD SOSTENIBLE',x:-2,y:-1,tip:'Reto: ¿qué transporte contamina menos?',emoji:'🚲',color:'#0ea5e9',kind:'bike'},
  {id:'mission-rain',name:'AGUA LLUVIA',x:1,y:0,tip:'Reto: ¿cómo puedes ahorrar agua?',emoji:'🌧️',color:'#38bdf8',kind:'water'},
  {id:'mission-earth',name:'PLANETA TIERRA',x:-2,y:-4,tip:'Reto: propone una acción ecológica para el curso.',emoji:'🌎',color:'#2563eb',kind:'earth'},
  {id:'mission-forest',name:'BOSQUE',x:4,y:-2,tip:'Reto: ¿cómo ayuda el bosque al suelo?',emoji:'🌿',color:'#15803d',kind:'forest'},
  {id:'mission-energy',name:'AHORRO DE ENERGÍA',x:-4,y:2,tip:'Reto: ¿qué aparato puedes apagar al salir?',emoji:'🔋',color:'#a3e635',kind:'battery'},
  {id:'mission-butterfly',name:'MARIPOSAS',x:2,y:4,tip:'Reto: ¿qué necesitan las mariposas para vivir?',emoji:'🦋',color:'#c084fc',kind:'butterfly'},
  {id:'mission-compost',name:'COMPOSTAJE',x:-3,y:-4,tip:'Reto: ¿qué residuos sirven para hacer abono?',emoji:'🪴',color:'#a16207',kind:'pot'}
];
// Construye figuras 3D coloridas para las doce misiones nuevas y las ubica según (x,y).
function addPrimitive(parent,tag,attrs){const el=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));parent.appendChild(el);return el;}
function addNewMission(m){
  const holder=document.createElement('a-entity');holder.setAttribute('id',m.id);holder.setAttribute('position',`${(m.x*.22).toFixed(2)} 0.05 ${(-m.y*.22).toFixed(2)}`);
  const color=m.color;
  if(m.kind==='bee'){
    addPrimitive(holder,'a-sphere',{position:'0 0.36 0',radius:'.18',color:'#facc15',scale:'1.25 .85 .8'});
    addPrimitive(holder,'a-box',{position:'0 0.36 .13',width:'.07',height:'.28',depth:'.025',color:'#202020'});
    addPrimitive(holder,'a-sphere',{position:'-.12 .53 -.02',radius:'.10',color:'#e0f2fe',opacity:'.9'});
    addPrimitive(holder,'a-sphere',{position:'.12 .53 -.02',radius:'.10',color:'#e0f2fe',opacity:'.9'});
  }else if(m.kind==='plant'||m.kind==='forest'){
    addPrimitive(holder,'a-cylinder',{position:'0 .17 0',radius:'.10',height:'.34',color:'#8b5e34'});
    addPrimitive(holder,'a-sphere',{position:'0 .47 0',radius:'.22',color});
    addPrimitive(holder,'a-sphere',{position:'-.13 .40 .02',radius:'.14',color:'#4ade80'});
    addPrimitive(holder,'a-sphere',{position:'.13 .40 .02',radius:'.14',color:'#15803d'});
  }else if(m.kind==='wind'){
    addPrimitive(holder,'a-cylinder',{position:'0 .30 0',radius:'.025',height:'.60',color:'#e2e8f0'});
    for(let a=0;a<3;a++){const blade=addPrimitive(holder,'a-box',{position:'0 .59 0',width:'.07',height:'.27',depth:'.035',color});blade.setAttribute('rotation',`0 0 ${a*120}`);}
    addPrimitive(holder,'a-sphere',{position:'0 .59 .03',radius:'.055',color:'#fff'});
  }else if(m.kind==='animal'){
    addPrimitive(holder,'a-sphere',{position:'0 .26 0',radius:'.20',color});
    addPrimitive(holder,'a-sphere',{position:'0 .40 .15',radius:'.13',color:'#65a30d'});
    for(let a=-1;a<=1;a+=2)addPrimitive(holder,'a-sphere',{position:`${a*.14} .13 .03`,radius:'.065',color:'#166534'});
  }else if(m.kind==='flower'||m.kind==='butterfly'){
    if(m.kind==='flower'){
      addPrimitive(holder,'a-cylinder',{position:'0 .23 0',radius:'.025',height:'.42',color:'#16a34a'});
      addPrimitive(holder,'a-sphere',{position:'0 .48 0',radius:'.09',color:'#facc15'});
      for(let a=0;a<6;a++){const ang=a*Math.PI/3;addPrimitive(holder,'a-sphere',{position:`${(Math.cos(ang)*.12).toFixed(2)} .48 ${(Math.sin(ang)*.12).toFixed(2)}`,radius:'.08',color});}
    }else{
      addPrimitive(holder,'a-sphere',{position:'-.12 .42 .02',radius:'.15',color,scale:'1 .8 .45'});
      addPrimitive(holder,'a-sphere',{position:'.12 .42 .02',radius:'.15',color,scale:'1 .8 .45'});
      addPrimitive(holder,'a-cylinder',{position:'0 .40 .04',radius:'.025',height:'.28',color:'#334155'});
    }
  }else if(m.kind==='bike'){
    for(const x of [-.16,.16])addPrimitive(holder,'a-torus',{position:`${x} .18 0`,radius:'.11',radiusTubular:'.018',color:'#0f172a'});
    addPrimitive(holder,'a-box',{position:'0 .27 0',width:'.27',height:'.025',depth:'.025',color});
    addPrimitive(holder,'a-box',{position:'-.07 .34 0',width:'.025',height:'.14',depth:'.025',color});
    addPrimitive(holder,'a-box',{position:'.09 .34 0',width:'.025',height:'.14',depth:'.025',color});
  }else if(m.kind==='water'){
    addPrimitive(holder,'a-sphere',{position:'0 .30 0',radius:'.20',color,scale:'.8 1.15 .8'});
    addPrimitive(holder,'a-sphere',{position:'-.12 .48 .02',radius:'.09',color:'#bae6fd'});
  }else if(m.kind==='earth'){
    addPrimitive(holder,'a-sphere',{position:'0 .36 0',radius:'.24',color:'#2563eb'});
    addPrimitive(holder,'a-sphere',{position:'-.08 .44 .19',radius:'.10',color:'#22c55e',scale:'1 .7 .5'});
    addPrimitive(holder,'a-sphere',{position:'.10 .28 .18',radius:'.08',color:'#16a34a',scale:'1 .7 .5'});
  }else if(m.kind==='battery'){
    addPrimitive(holder,'a-box',{position:'0 .31 0',width:'.28',height:'.43',depth:'.20',color});
    addPrimitive(holder,'a-box',{position:'0 .55 0',width:'.10',height:'.05',depth:'.08',color:'#475569'});
    addPrimitive(holder,'a-text',{value:'+',align:'center',color:'#365314',width:'1',scale:'.45 .45 .45',position:'0 .28 .12'});
  }else if(m.kind==='pot'){
    addPrimitive(holder,'a-cylinder',{position:'0 .20 0',radius:'.16',height:'.26',color:'#c2410c',scale:'1 .8 1'});
    addPrimitive(holder,'a-cylinder',{position:'0 .34 0',radius:'.17',height:'.05',color:'#713f12'});
    addPrimitive(holder,'a-sphere',{position:'-.06 .49 0',radius:'.10',color:'#22c55e'});
    addPrimitive(holder,'a-sphere',{position:'.08 .52 0',radius:'.11',color:'#4ade80'});
  }
  const board=addPrimitive(holder,'a-box',{position:'0 .91 .03',width:'1.18',height:'.43',depth:'.035',color,opacity:'1'});
  addPrimitive(holder,'a-text',{value:m.name,align:'center',color:'#073b2a',width:'3.2',scale:'.25 .25 .25',position:'0 1.01 .06',wrapCount:'28'});
  addPrimitive(holder,'a-text',{value:`(${m.x}, ${m.y})`,align:'center',color:'#073b2a',width:'3.0',scale:'.36 .36 .36',position:'0 .80 .06'});
  marker.querySelector('a-entity[scale]').appendChild(holder);
}
missions.slice(4).forEach(addNewMission);
// Movimiento suave de flotación para las 16 misiones, sin desplazar sus coordenadas X/Z.
function addFloatAnimation(el){
  if(!el) return;
  const p=(el.getAttribute('position')||{x:0,y:0,z:0});
  const x=Number(p.x)||0, y=Number(p.y)||0, z=Number(p.z)||0;
  el.setAttribute('animation__float',{
    property:'position',
    from:`${x} ${y} ${z}`,
    to:`${x} ${(y+0.08).toFixed(2)} ${z}`,
    dir:'alternate',dur:1500,easing:'easeInOutSine',loop:true
  });
}
missions.forEach(m=>addFloatAnimation(document.getElementById(m.id)));
const chosen=missions[Math.floor(Math.random()*missions.length)];
missions.forEach(m=>{const el=document.getElementById(m.id); if(el) el.setAttribute('visible',m.id===chosen.id);});
const help=document.querySelector('#help');
help.textContent='Tu misión: '+chosen.name+' · '+chosen.tip+' · Apunta al marcador KANJI.';
status.textContent='Tu misión: '+chosen.name+' · enfocando KANJI';
window.addEventListener('camera-init',()=>{status.textContent='Cámara activa · enfoca KANJI';});
scene.addEventListener('camera-init',()=>{status.textContent='Cámara activa · enfoca KANJI';});
window.addEventListener('camera-error',()=>{status.textContent='Cámara bloqueada: permite el acceso en Chrome';});
scene.addEventListener('camera-error',()=>{status.textContent='Cámara bloqueada: permite el acceso en Chrome';});
marker.addEventListener('markerFound',()=>{status.textContent='¡Misión activada! 🌿';});
marker.addEventListener('markerLost',()=>{status.textContent='Cámara activa · enfoca KANJI';});
</script>
</body>
</html>
