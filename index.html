<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Misión Verde - Realidad Aumentada</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #panel {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 100;
      background: rgba(255,255,255,0.94);
      border-radius: 18px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      text-align: center;
      color: #17351e;
    }

    #panel h1 {
      margin: 0;
      color: #126b3a;
      font-size: 22px;
    }

    #panel p {
      margin: 6px 0;
      font-size: 14px;
    }

    #estado {
      font-weight: bold;
      color: #126b3a;
    }
  </style>
</head>

<body>

  <!-- PANEL DE INFORMACIÓN -->
  <div id="panel">

    <h1>🌎 MISIÓN VERDE</h1>

    <p>
      <strong>Plano Cartesiano + Medio Ambiente</strong>
    </p>

    <p>
      Apunta la cámara al marcador HIRO.
    </p>

    <p id="estado">
      📷 Buscando marcador...
    </p>

  </div>


  <!-- EXPERIENCIA AR -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- MARCADOR -->
    <a-marker
      type="pattern"
      url="marker.patt"
      id="mision verde">

      <!-- ========================= -->
      <!-- PLANO CARTESIANO -->
      <!-- ========================= -->

      <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="5.5"
        height="5.5"
        color="#EAF5EA">
      </a-plane>


      <!-- EJE X -->
      <a-box
        position="0 0.03 0"
        width="5.2"
        height="0.04"
        depth="0.04"
        color="#17351E">
      </a-box>


      <!-- EJE Y -->
      <a-box
        position="0 0.03 0"
        width="0.04"
        height="0.04"
        depth="5.2"
        color="#17351E">
      </a-box>


      <!-- ========================= -->
      <!-- ÁRBOL (5,2) -->
      <!-- ========================= -->

      <a-cylinder
        position="1.8 0.45 0.75"
        radius="0.12"
        height="0.9"
        color="#70452A">
      </a-cylinder>

      <a-sphere
        position="1.8 1.05 0.75"
        radius="0.55"
        color="#2E8B45">
      </a-sphere>

      <a-sphere
        position="1.45 0.95 0.75"
        radius="0.38"
        color="#3FA653">
      </a-sphere>

      <a-sphere
        position="2.1 0.95 0.75"
        radius="0.38"
        color="#3FA653">
      </a-sphere>

      <a-text
        value="ARBOL (5,2)"
        position="1.8 1.75 0.75"
        align="center"
        color="#17351E"
        scale="0.7 0.7 0.7">
      </a-text>


      <!-- ========================= -->
      <!-- RÍO (-3,1) -->
      <!-- ========================= -->

      <a-box
        position="-1.1 0.04 0.35"
        width="1.7"
        height="0.05"
        depth="0.55"
        rotation="0 0 -10"
        color="#299BD3">
      </a-box>

      <a-box
        position="-1.25 0.05 0.15"
        width="0.9"
        height="0.05"
        depth="0.3"
        rotation="0 0 12"
        color="#5BC0EB">
      </a-box>

      <a-text
        value="RIO (-3,1)"
        position="-1.1 0.45 0.35"
        align="center"
        color="#17351E"
        scale="0.65 0.65 0.65">
      </a-text>


      <!-- ========================= -->
      <!-- RECICLAJE (2,-2) -->
      <!-- ========================= -->

      <a-box
        position="0.7 0.38 -1.0"
        width="0.55"
        height="0.75"
        depth="0.55"
        color="#3D9B59">
      </a-box>

      <a-box
        position="0.7 0.8 -1.0"
        width="0.65"
        height="0.08"
        depth="0.65"
        color="#267541">
      </a-box>

      <a-text
        value="RECICLAJE (2,-2)"
        position="0.7 1.1 -1.0"
        align="center"
        color="#17351E"
        scale="0.55 0.55 0.55">
      </a-text>


      <!-- ========================= -->
      <!-- PANEL SOLAR (-4,-3) -->
      <!-- ========================= -->

      <a-box
        position="-1.5 0.35 -1.45"
        width="1.0"
        height="0.06"
        depth="0.7"
        rotation="-15 0 0"
        color="#185A8D">
      </a-box>

      <!-- líneas del panel -->
      <a-box
        position="-1.5 0.39 -1.45"
        width="0.02"
        height="0.02"
        depth="0.68"
        color="#FFFFFF">
      </a-box>

      <a-box
        position="-1.5 0.39 -1.45"
        width="0.98"
        height="0.02"
        depth="0.02"
        color="#FFFFFF">
      </a-box>

      <a-text
        value="PANEL SOLAR (-4,-3)"
        position="-1.5 0.9 -1.45"
        align="center"
        color="#17351E"
        scale="0.55 0.55 0.55">
      </a-text>


      <!-- ========================= -->
      <!-- TÍTULO -->
      <!-- ========================= -->

      <a-text
        value="MISIÓN VERDE"
        position="0 2.35 0"
        align="center"
        color="#126B3A"
        scale="1.2 1.2 1.2">
      </a-text>


      <!-- MENSAJE -->
      <a-text
        value="UBICA • ANALIZA • PROTEGE"
        position="0 2.0 0"
        align="center"
        color="#17351E"
        scale="0.65 0.65 0.65">
      </a-text>

    </a-marker>


    <!-- CÁMARA -->
    <a-entity camera></a-entity>

  </a-scene>


  <script>

    const marcador = document.querySelector("#marcador");
    const estado = document.querySelector("#estado");

    marcador.addEventListener("markerFound", function () {

      estado.innerHTML =
        "✅ ¡Marcador encontrado! Explora la Misión Verde.";

    });

    marcador.addEventListener("markerLost", function () {

      estado.innerHTML =
        "📷 Apunta nuevamente al marcador.";

    });

  </script>

</body>
</html>
